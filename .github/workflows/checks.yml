name: Ontology checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: python -m pip install -r requirements.txt
      - name: Competency questions, SHACL and HermiT OWL 2 DL check
        run: python cq_suite.py --md era-energy-settlement-cqs.md
      - name: Committed report is up to date
        run: git diff --exit-code era-energy-settlement-cqs.md
